<script>

// React exige un objet pour la prop style ; les gabarits htm écrivent des
// chaînes CSS. On convertit au passage plutôt que de dupliquer la syntaxe.
function h(type, props, ...enfants) {
  if (props && typeof props.style === 'string') {
    const obj = {};
    props.style.split(';').forEach(function (decl) {
      const i = decl.indexOf(':');
      if (i < 0) return;
      const cle = decl.slice(0, i).trim().replace(/-([a-z])/g, (_, c) => c.toUpperCase());
      obj[cle] = decl.slice(i + 1).trim();
    });
    props = Object.assign({}, props, { style: obj });
  }
  if (props) {
    const alias = { class: 'className', autocomplete: 'autoComplete', for: 'htmlFor',
                    inputmode: 'inputMode', readonly: 'readOnly', maxlength: 'maxLength' };
    let copie = null;
    for (const k in alias) {
      if (k in props) {
        copie = copie || Object.assign({}, props);
        copie[alias[k]] = copie[k];
        delete copie[k];
      }
    }
    if (copie) props = copie;
  }
  return React.createElement(type, props, ...enfants);
}
const html = htm.bind(h);

function ouvrirModale(ref){
  const el = ref.current;
  if (el && !el.open) { try { el.showModal(); } catch (e) { console.error(e); } }
}
function fermerModale(ref){

}

// Envoie un fichier dans le bucket « photos » et renvoie son URL publique.
async function envoyerPhoto(fichier, prefixe) {
  const ext = (fichier.name.split('.').pop() || 'jpg').toLowerCase();
  const chemin = prefixe + '/' + Date.now() + '-' +
                 Math.random().toString(36).slice(2, 8) + '.' + ext;
  const { error } = await sb.storage.from('photos')
    .upload(chemin, fichier, { upsert: false, contentType: fichier.type });
  if (error) throw error;
  return sb.storage.from('photos').getPublicUrl(chemin).data.publicUrl;
}

/* ---------------------------------------------------------------- Connexion */
function Login({ onError }) {
  const [email,setEmail] = useState('');
  const [mdp,setMdp] = useState('');
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState('');

  async function entrer(){
    setBusy(true); setErr('');
    const { error } = await sb.auth.signInWithPassword({ email, password: mdp });
    if (error) setErr("Identifiants refusés. Vérifie l'adresse et le mot de passe.");
    setBusy(false);
  }

  return html`
    <div class="login">
      <div class="login-card">
        <img src="/logo-briffe.png" alt="BRIFFE — Becquetez et Festoyez"
          style="display:block;height:58px;width:auto;margin-bottom:6px" />
        <div class="sep"></div>
        <div class="eyebrow" style="margin-bottom:18px">Back-office commandes</div>
        ${err && html`<div class="err">${err}</div>`}
        <label><span class="lab">Adresse e-mail</span>
          <input type="email" value=${email} autocomplete="username"
                 onKeyDown=${e=>e.key==='Enter'&&entrer()}
                 onInput=${e=>setEmail(e.target.value)} /></label>
        <label><span class="lab">Mot de passe</span>
          <input type="password" value=${mdp} autocomplete="current-password"
                 onKeyDown=${e=>e.key==='Enter'&&entrer()}
                 onInput=${e=>setMdp(e.target.value)} /></label>
        <button class="btn" style="width:100%" disabled=${busy||!email||!mdp} onClick=${entrer}>
          ${busy ? 'Connexion…' : 'Se connecter'}
        </button>
      </div>
    </div>`;
}

/* ------------------------------------------------------------ Champ photo */
function ChampPhoto({ valeur, prefixe, onChange, toast }) {
  const [envoi,setEnvoi] = useState(false);
  const champ = useRef(null);

  async function choisir(e) {
    const fichier = e.target.files && e.target.files[0];
    if (!fichier) return;
    if (fichier.size > 5 * 1024 * 1024)
      return toast('Image trop lourde : 5 Mo maximum.');
    setEnvoi(true);
    try {
      onChange(await envoyerPhoto(fichier, prefixe));
      toast('Photo ajoutée');
    } catch (err) {
      toast("Envoi refusé : " + (err.message || 'erreur inconnue'));
    }
    setEnvoi(false);
    if (champ.current) champ.current.value = '';
  }

  return html`
    <div class="zone-photo">
      ${valeur
        ? html`<img class="vignette" src=${valeur} alt="" />`
        : html`<div class="vignette-vide">Sans photo</div>`}
      <div>
        <span class="lab">Photo</span>
        <input type="file" accept="image/jpeg,image/png,image/webp,image/avif"
               ref=${champ} disabled=${envoi} onChange=${choisir} />
        <div class="muted" style="margin-top:6px">
          ${envoi ? 'Envoi en cours…' : 'JPEG, PNG ou WebP — 5 Mo maximum.'}
        </div>
        ${valeur && html`
          <button type="button" class="btn danger" style="margin-top:8px"
            onClick=${()=>onChange(null)}>Retirer la photo</button>`}
      </div>
    </div>`;
}

/* ------------------------------------------------------------- Composants */
function Composants({ allergenes, toast }) {
  const [items,setItems] = useState(null);
  const [edit,setEdit] = useState(null);
  const dlg = useRef(null);

  const charger = useCallback(async ()=>{
    const { data } = await sb.from('composants')
      .select('*, composant_allergenes(allergene_id)')
      .order('type').order('nom');
    setItems(data || []);
  },[]);
  useEffect(()=>{ charger(); },[charger]);
  useEffect(()=>{ if(edit) ouvrirModale(dlg); else fermerModale(dlg); },[edit]);

  function nouveau(){ setEdit({ type:'entree', nom:'', description:'', grammage_g:180,
                                actif:true, photo_url:null, allerg:[] }); }
  function ouvrir(c){
    setEdit({ ...c, allerg:(c.composant_allergenes||[]).map(a=>a.allergene_id) });
  }

  async function enregistrer(){
    const { allerg, composant_allergenes, id, ...champs } = edit;
    let cid = id;
    if (id) {
      const { error } = await sb.from('composants').update(champs).eq('id', id);
      if (error) return toast('Enregistrement refusé : ' + error.message);
    } else {
      const { data, error } = await sb.from('composants').insert(champs).select('id').single();
      if (error) return toast('Création refusée : ' + error.message);
      cid = data.id;
    }
    await sb.from('composant_allergenes').delete().eq('composant_id', cid);
    if (allerg.length) {
      await sb.from('composant_allergenes')
        .insert(allerg.map(a=>({ composant_id:cid, allergene_id:a })));
    }
    setEdit(null); charger(); toast('Composant enregistré');
  }

  async function supprimer(c){
    if (!confirm(`Supprimer « ${c.nom} » ? Cette action est définitive.`)) return;
    const { error } = await sb.from('composants').delete().eq('id', c.id);
    if (error) return toast("Suppression impossible : ce composant est utilisé dans un plateau.");
    charger(); toast('Composant supprimé');
  }

  const basculer = id => setEdit(e => ({...e,
    allerg: e.allerg.includes(id) ? e.allerg.filter(x=>x!==id) : [...e.allerg, id] }));

  if (!items) return html`<div class="muted">Chargement…</div>`;

  return html`
    <div>
      <div class="head">
        <div>
          <h2>Composants</h2>
          <div class="muted">Entrées, plats et desserts. Les allergènes se déclarent ici, une seule fois.</div>
        </div>
        <button class="btn" onClick=${nouveau}>Nouveau composant</button>
      </div>

      ${items.length === 0
        ? html`<div class="empty">Aucun composant. Commence par créer une entrée, un plat ou un dessert.</div>`
        : TYPES.map(t => {
            const liste = items.filter(i=>i.type===t.v);
            if (!liste.length) return null;
            return html`<div key=${t.v} style="margin-bottom:26px">
              <div class="eyebrow" style="margin-bottom:8px">${t.label}s — ${liste.length}</div>
              ${liste.map(c => html`
                <div class="card" key=${c.id}>
                  <div class="row">
                    ${c.photo_url && html`<img class="vignette" src=${c.photo_url} alt="" />`}
                    <div style="flex:1;min-width:220px">
                      <div style="font-weight:500">${c.nom}${!c.actif && html`<span class="muted"> — inactif</span>`}</div>
                      ${c.description && html`<div class="muted">${c.description}</div>`}
                      <div class="muted">${c.grammage_g ? c.grammage_g + ' g' : 'grammage non renseigné'}</div>
                      <div class="tags">
                        ${(c.composant_allergenes||[]).length === 0
                          ? html`<span class="muted">Aucun allergène déclaré</span>`
                          : c.composant_allergenes.map(a => html`
                              <span class="tag on" key=${a.allergene_id}>
                                ${(allergenes.find(x=>x.id===a.allergene_id)||{}).libelle}
                              </span>`)}
                      </div>
                    </div>
                    <div class="actions">
                      <button class="btn ghost" onClick=${()=>ouvrir(c)}>Modifier</button>
                      <button class="btn danger" onClick=${()=>supprimer(c)}>Supprimer</button>
                    </div>
                  </div>
                </div>`)}
            </div>`;
          })}

      <dialog ref=${dlg} onClose=${()=>setEdit(null)}>
        ${edit && html`<div>
          <div class="dlg-body">
            <h3 style="margin-bottom:16px">${edit.id ? 'Modifier le composant' : 'Nouveau composant'}</h3>
            <div class="grid2">
              <label><span class="lab">Type</span>
                <select value=${edit.type} onChange=${e=>{
                  const t = TYPES.find(x=>x.v===e.target.value);
                  setEdit({...edit, type:t.v, grammage_g: edit.id ? edit.grammage_g : t.gram});
                }}>
                  ${TYPES.map(t=>html`<option key=${t.v} value=${t.v}>${t.label}</option>`)}
                </select></label>
              <label><span class="lab">Grammage (g)</span>
                <input type="number" value=${edit.grammage_g ?? ''}
                  onInput=${e=>setEdit({...edit, grammage_g: e.target.value === '' ? null : +e.target.value})} /></label>
            </div>
            <label><span class="lab">Nom</span>
              <input value=${edit.nom} onInput=${e=>setEdit({...edit, nom:e.target.value})} /></label>
            <label><span class="lab">Composition détaillée</span>
              <textarea rows="2" value=${edit.description||''}
                onInput=${e=>setEdit({...edit, description:e.target.value})}></textarea></label>

            <${ChampPhoto} valeur=${edit.photo_url} prefixe="composants" toast=${toast}
              onChange=${url=>setEdit({...edit, photo_url:url})} />

            <span class="lab">Allergènes — les 14 à déclaration obligatoire</span>
            <div class="tags">
              ${allergenes.map(a => html`
                <button type="button" key=${a.id}
                  class=${'tag' + (edit.allerg.includes(a.id) ? ' on' : '')}
                  aria-pressed=${edit.allerg.includes(a.id)}
                  onClick=${()=>basculer(a.id)}>${a.libelle}</button>`)}
            </div>

            <div class="sep"></div>
            <label style="display:flex;gap:8px;align-items:center;margin:0">
              <input type="checkbox" style="width:auto" checked=${edit.actif}
                onChange=${e=>setEdit({...edit, actif:e.target.checked})} />
              <span>Disponible à la composition des plateaux</span>
            </label>
          </div>
          <div class="dlg-foot">
            <button class="btn ghost" onClick=${()=>setEdit(null)}>Annuler</button>
            <button class="btn" disabled=${!edit.nom.trim()} onClick=${enregistrer}>Enregistrer</button>
          </div>
        </div>`}
      </dialog>
    </div>`;
}

/* --------------------------------------------------------------- Plateaux */
function Plateaux({ allergenes, toast }) {
  const [items,setItems] = useState(null);
  const [composants,setComposants] = useState([]);
  const [edit,setEdit] = useState(null);
  const dlg = useRef(null);

  const charger = useCallback(async ()=>{
    const [{ data:p }, { data:c }] = await Promise.all([
      sb.from('plateaux')
        .select('*, plateau_composants(type, composant_id, composants(nom, type, composant_allergenes(allergene_id)))')
        .order('nom'),
      sb.from('composants').select('id, nom, type').eq('actif', true).order('nom'),
    ]);
    setItems(p || []); setComposants(c || []);
  },[]);
  useEffect(()=>{ charger(); },[charger]);
  useEffect(()=>{ if(edit) ouvrirModale(dlg); else fermerModale(dlg); },[edit]);

  function nouveau(){
    setEdit({ nom:'', categorie:'viande', description:'', prix_ht:'', tva_pct:10, actif:true,
              photo_url:null, compo:{entree:'',plat:'',dessert:''} });
  }
  function ouvrir(p){
    const compo = {entree:'',plat:'',dessert:''};
    (p.plateau_composants||[]).forEach(pc => compo[pc.type] = pc.composant_id);
    setEdit({ ...p, compo });
  }

  async function enregistrer(){
    const { compo, plateau_composants, id, ...champs } = edit;
    champs.prix_ht = +champs.prix_ht;
    let pid = id;
    if (id) {
      const { error } = await sb.from('plateaux').update(champs).eq('id', id);
      if (error) return toast('Enregistrement refusé : ' + error.message);
    } else {
      const { data, error } = await sb.from('plateaux').insert(champs).select('id').single();
      if (error) return toast('Création refusée : ' + error.message);
      pid = data.id;
    }
    await sb.from('plateau_composants').delete().eq('plateau_id', pid);
    const lignes = Object.entries(compo).filter(([,v])=>v)
      .map(([type,composant_id])=>({ plateau_id:pid, type, composant_id }));
    if (lignes.length) await sb.from('plateau_composants').insert(lignes);
    setEdit(null); charger(); toast('Plateau enregistré');
  }

  async function supprimer(p){
    if (!confirm(`Supprimer le plateau « ${p.nom} » ? Cette action est définitive.`)) return;
    const { error } = await sb.from('plateaux').delete().eq('id', p.id);
    if (error) return toast("Suppression impossible : ce plateau figure dans un menu ou une commande.");
    charger(); toast('Plateau supprimé');
  }

  // Les allergènes du plateau sont la réunion de ceux de ses trois composants.
  function allergenesDuPlateau(p){
    const ids = new Set();
    (p.plateau_composants||[]).forEach(pc =>
      (pc.composants?.composant_allergenes||[]).forEach(a => ids.add(a.allergene_id)));
    return [...ids].sort((a,b)=>a-b).map(id => (allergenes.find(x=>x.id===id)||{}).libelle);
  }

  if (!items) return html`<div class="muted">Chargement…</div>`;

  return html`
    <div>
      <div class="head">
        <div>
          <h2>Plateaux</h2>
          <div class="muted">Une entrée, un plat, un dessert. Les allergènes remontent tout seuls des composants.</div>
        </div>
        <button class="btn" onClick=${nouveau}>Nouveau plateau</button>
      </div>

      ${items.length === 0
        ? html`<div class="empty">Aucun plateau. Crée d'abord tes composants, puis assemble-les ici.</div>`
        : items.map(p => {
            const compo = {}; (p.plateau_composants||[]).forEach(pc => compo[pc.type]=pc.composants?.nom);
            const alg = allergenesDuPlateau(p);
            return html`<div class="card" key=${p.id}>
              <div class="row">
                ${p.photo_url
                  ? html`<img class="vignette" src=${p.photo_url} alt="" />`
                  : html`<div class="vignette-vide">Sans photo</div>`}
                <div style="flex:1;min-width:240px">
                  <h3>${p.nom}${!p.actif && html`<span class="muted" style="font-family:'IkiMono'"> — inactif</span>`}</h3>
                  <div class="tags" style="margin:6px 0 10px"><span class="tag cat">${p.categorie}</span></div>
                  ${TYPES.map(t => html`
                    <div key=${t.v} style="margin-bottom:3px">
                      <span class="type-mark">${t.label}</span>
                      ${compo[t.v] || html`<span class="muted">à définir</span>`}
                    </div>`)}
                  <div class="tags" style="margin-top:10px">
                    ${alg.length === 0
                      ? html`<span class="muted">Aucun allergène</span>`
                      : alg.map(l => html`<span class="tag on" key=${l}>${l}</span>`)}
                  </div>
                </div>
                <div style="text-align:right">
                  <div class="prix">${euros(p.prix_ht)}</div>
                  <div class="muted">HT — TVA ${p.tva_pct} %</div>
                  <div class="actions" style="margin-top:10px;justify-content:flex-end">
                    <button class="btn ghost" onClick=${()=>ouvrir(p)}>Modifier</button>
                    <button class="btn danger" onClick=${()=>supprimer(p)}>Supprimer</button>
                  </div>
                </div>
              </div>
            </div>`;
          })}

      <dialog ref=${dlg} onClose=${()=>setEdit(null)}>
        ${edit && html`<div>
          <div class="dlg-body">
            <h3 style="margin-bottom:16px">${edit.id ? 'Modifier le plateau' : 'Nouveau plateau'}</h3>
            <label><span class="lab">Nom</span>
              <input value=${edit.nom} onInput=${e=>setEdit({...edit, nom:e.target.value})} /></label>
            <div class="grid2">
              <label><span class="lab">Catégorie</span>
                <select value=${edit.categorie} onChange=${e=>setEdit({...edit, categorie:e.target.value})}>
                  ${CATEGORIES.map(c=>html`<option key=${c} value=${c}>${c}</option>`)}
                </select></label>
              <label><span class="lab">Prix HT (€)</span>
                <input type="number" step="0.01" value=${edit.prix_ht}
                  onInput=${e=>setEdit({...edit, prix_ht:e.target.value})} /></label>
            </div>
            <label><span class="lab">Mention affichée</span>
              <input value=${edit.description||''} placeholder="Chaud ou froid, à votre goût"
                onInput=${e=>setEdit({...edit, description:e.target.value})} /></label>

            <${ChampPhoto} valeur=${edit.photo_url} prefixe="plateaux" toast=${toast}
              onChange=${url=>setEdit({...edit, photo_url:url})} />

            <div class="sep"></div>
            <span class="lab">Composition</span>
            ${TYPES.map(t => html`
              <label key=${t.v}><span class="lab">${t.label}</span>
                <select value=${edit.compo[t.v]||''}
                  onChange=${e=>setEdit({...edit, compo:{...edit.compo, [t.v]:e.target.value}})}>
                  <option value="">— à définir —</option>
                  ${composants.filter(c=>c.type===t.v).map(c=>html`
                    <option key=${c.id} value=${c.id}>${c.nom}</option>`)}
                </select></label>`)}

            <label style="display:flex;gap:8px;align-items:center;margin:0">
              <input type="checkbox" style="width:auto" checked=${edit.actif}
                onChange=${e=>setEdit({...edit, actif:e.target.checked})} />
              <span>Proposable au menu</span>
            </label>
          </div>
          <div class="dlg-foot">
            <button class="btn ghost" onClick=${()=>setEdit(null)}>Annuler</button>
            <button class="btn" disabled=${!edit.nom.trim()||edit.prix_ht===''} onClick=${enregistrer}>Enregistrer</button>
          </div>
        </div>`}
      </dialog>
    </div>`;
}

/* ------------------------------------------------------------------ Menus */
function Menus({ toast }) {
  const [items,setItems] = useState(null);
  const [plateaux,setPlateaux] = useState([]);
  const [edit,setEdit] = useState(null);
  const dlg = useRef(null);

  const charger = useCallback(async ()=>{
    const [{ data:m }, { data:p }] = await Promise.all([
      sb.from('menus').select('*, menu_plateaux(plateau_id, ordre, plateaux(nom, prix_ht, categorie))')
        .order('date_debut', { ascending:false }),
      sb.from('plateaux').select('id, nom, prix_ht').eq('actif', true).order('nom'),
    ]);
    setItems(m || []); setPlateaux(p || []);
  },[]);
  useEffect(()=>{ charger(); },[charger]);
  useEffect(()=>{ if(edit) ouvrirModale(dlg); else fermerModale(dlg); },[edit]);

  function nouveau(){
    const t = new Date().toISOString().slice(0,10);
    setEdit({ libelle:'', date_debut:t, date_fin:t, publie:false, choix:[] });
  }
  function ouvrir(m){
    setEdit({ ...m, choix:(m.menu_plateaux||[]).map(mp=>mp.plateau_id) });
  }
  function dupliquer(m){
    setEdit({ libelle: m.libelle + ' (copie)', date_debut:m.date_debut, date_fin:m.date_fin,
              publie:false, choix:(m.menu_plateaux||[]).map(mp=>mp.plateau_id) });
  }

  async function enregistrer(){
    const { choix, menu_plateaux, id, ...champs } = edit;
    let mid = id;
    if (id) {
      const { error } = await sb.from('menus').update(champs).eq('id', id);
      if (error) return toast('Enregistrement refusé : ' + error.message);
    } else {
      const { data, error } = await sb.from('menus').insert(champs).select('id').single();
      if (error) return toast('Création refusée : ' + error.message);
      mid = data.id;
    }
    await sb.from('menu_plateaux').delete().eq('menu_id', mid);
    if (choix.length) {
      await sb.from('menu_plateaux')
        .insert(choix.map((plateau_id,i)=>({ menu_id:mid, plateau_id, ordre:i+1 })));
    }
    setEdit(null); charger(); toast('Menu enregistré');
  }

  async function basculerPublication(m){
    const { error } = await sb.from('menus').update({ publie: !m.publie }).eq('id', m.id);
    if (error) return toast('Changement refusé : ' + error.message);
    charger(); toast(m.publie ? 'Menu retiré du portail' : 'Menu publié');
  }

  const basculer = id => setEdit(e => ({...e,
    choix: e.choix.includes(id) ? e.choix.filter(x=>x!==id) : [...e.choix, id] }));

  if (!items) return html`<div class="muted">Chargement…</div>`;

  return html`
    <div>
      <div class="head">
        <div>
          <h2>Menus</h2>
          <div class="muted">Une période, ses plateaux. Publier rend le menu visible sur le portail client.</div>
        </div>
        <button class="btn" onClick=${nouveau}>Nouveau menu</button>
      </div>

      ${items.length === 0
        ? html`<div class="empty">Aucun menu. Crée une période et choisis les plateaux qu'elle propose.</div>`
        : items.map(m => html`
          <div class="card" key=${m.id}>
            <div class="row">
              <div style="flex:1;min-width:240px">
                <h3>${m.libelle}</h3>
                <div class="muted">Du ${dateFr(m.date_debut)} au ${dateFr(m.date_fin)}</div>
                <div class="tags" style="margin-top:8px">
                  <span class=${'tag' + (m.publie ? ' on' : '')}>
                    ${m.publie ? 'Publié' : 'Brouillon'}
                  </span>
                  ${(m.menu_plateaux||[])
                    .sort((a,b)=>a.ordre-b.ordre)
                    .map(mp => html`<span class="tag" key=${mp.plateau_id}>
                      ${mp.plateaux?.nom} · ${euros(mp.plateaux?.prix_ht||0)}</span>`)}
                </div>
              </div>
              <div class="actions">
                <button class="btn ghost" onClick=${()=>dupliquer(m)}>Dupliquer</button>
                <button class="btn ghost" onClick=${()=>ouvrir(m)}>Modifier</button>
                <button class=${'btn' + (m.publie ? ' danger' : '')} onClick=${()=>basculerPublication(m)}>
                  ${m.publie ? 'Retirer' : 'Publier'}
                </button>
              </div>
            </div>
          </div>`)}

      <dialog ref=${dlg} onClose=${()=>setEdit(null)}>
        ${edit && html`<div>
          <div class="dlg-body">
            <h3 style="margin-bottom:16px">${edit.id ? 'Modifier le menu' : 'Nouveau menu'}</h3>
            <label><span class="lab">Libellé</span>
              <input value=${edit.libelle} placeholder="Menus du 24 août au 27 septembre 2026"
                onInput=${e=>setEdit({...edit, libelle:e.target.value})} /></label>
            <div class="grid2">
              <label><span class="lab">Début</span>
                <input type="date" value=${edit.date_debut}
                  onInput=${e=>setEdit({...edit, date_debut:e.target.value})} /></label>
              <label><span class="lab">Fin</span>
                <input type="date" value=${edit.date_fin}
                  onInput=${e=>setEdit({...edit, date_fin:e.target.value})} /></label>
            </div>
            <span class="lab">Plateaux de la période</span>
            <div class="tags">
              ${plateaux.map(p => html`
                <button type="button" key=${p.id}
                  class=${'tag' + (edit.choix.includes(p.id) ? ' on' : '')}
                  aria-pressed=${edit.choix.includes(p.id)}
                  onClick=${()=>basculer(p.id)}>${p.nom}</button>`)}
            </div>
            ${edit.date_fin < edit.date_debut &&
              html`<div class="err" style="margin-top:14px">La date de fin précède la date de début.</div>`}
          </div>
          <div class="dlg-foot">
            <button class="btn ghost" onClick=${()=>setEdit(null)}>Annuler</button>
            <button class="btn"
              disabled=${!edit.libelle.trim() || edit.date_fin < edit.date_debut}
              onClick=${enregistrer}>Enregistrer</button>
          </div>
        </div>`}
      </dialog>
    </div>`;
}

/* ------------------------------------------------------------- Paramètres */
function Parametres({ toast }) {
  const [p,setP] = useState(null);
  const [creneaux,setCreneaux] = useState([]);

  const charger = useCallback(async ()=>{
    const [{ data:par }, { data:cr }] = await Promise.all([
      sb.from('parametres').select('*').single(),
      sb.from('creneaux_livraison').select('*').order('heure_debut'),
    ]);
    setP(par); setCreneaux(cr || []);
  },[]);
  useEffect(()=>{ charger(); },[charger]);

  async function enregistrer(){
    const cp = (p.cpTexte ?? p.zone_livraison_cp.join(', '))
      .split(',').map(s=>s.trim()).filter(Boolean);
    const { cpTexte, id, ...champs } = p;
    const { error } = await sb.from('parametres')
      .update({ ...champs, zone_livraison_cp: cp }).eq('id', true);
    if (error) return toast('Enregistrement refusé : ' + error.message);
    charger(); toast('Paramètres enregistrés');
  }

  if (!p) return html`<div class="muted">Chargement…</div>`;

  return html`
    <div>
      <div class="head">
        <div>
          <h2>Paramètres de commande</h2>
          <div class="muted">Les règles que le portail applique avant d'accepter une commande.</div>
        </div>
        <button class="btn" onClick=${enregistrer}>Enregistrer</button>
      </div>

      <div class="card">
        <div class="grid2">
          <label><span class="lab">Délai minimum (jours)</span>
            <input type="number" value=${p.delai_commande_jours}
              onInput=${e=>setP({...p, delai_commande_jours:+e.target.value})} /></label>
          <label><span class="lab">Heure limite</span>
            <input type="time" value=${(p.heure_limite||'').slice(0,5)}
              onInput=${e=>setP({...p, heure_limite:e.target.value})} /></label>
        </div>
        <label><span class="lab">Minimum de plateaux par commande</span>
          <input type="number" value=${p.minimum_plateaux}
            onInput=${e=>setP({...p, minimum_plateaux:+e.target.value})} /></label>
        <label style="margin:0"><span class="lab">Codes postaux livrés (séparés par des virgules)</span>
          <textarea rows="2" value=${p.cpTexte ?? p.zone_livraison_cp.join(', ')}
            onInput=${e=>setP({...p, cpTexte:e.target.value})}></textarea></label>
      </div>

      <div class="eyebrow" style="margin:24px 0 8px">Créneaux de livraison</div>
      ${creneaux.map(c => html`
        <div class="card" key=${c.id}>
          <div class="row" style="align-items:center">
            <div>${c.libelle} <span class="muted">${c.actif ? '' : '— désactivé'}</span></div>
            <button class="btn ghost" onClick=${async ()=>{
              await sb.from('creneaux_livraison').update({ actif: !c.actif }).eq('id', c.id);
              charger(); toast(c.actif ? 'Créneau désactivé' : 'Créneau réactivé');
            }}>${c.actif ? 'Désactiver' : 'Réactiver'}</button>
          </div>
        </div>`)}
    </div>`;
}


/* ----------------------------------------------------------------- Clients */
const TYPES_COMPTE = [
  { v:'libre',   label:'Libre-service — paiement CB' },
  { v:'mensuel', label:'Compte mensuel — facturation différée' },
];

function Clients({ toast }) {
  const [items,setItems] = useState(null);
  const [recherche,setRecherche] = useState('');
  const [fiche,setFiche] = useState(null);      // client consulté
  const [detail,setDetail] = useState(null);    // adresses + contacts + commandes
  const [edit,setEdit] = useState(null);
  const [adresse,setAdresse] = useState(null);
  const [invite,setInvite] = useState(null);
  const [envoi,setEnvoi] = useState(false);
  const dlgFiche = useRef(null);
  const dlgInvite = useRef(null);
  const dlgEdit = useRef(null);
  const dlgAdr = useRef(null);

  const charger = useCallback(async ()=>{
    const { data } = await sb.from('clients').select('*').order('nom');
    setItems(data || []);
  },[]);
  useEffect(()=>{ charger(); },[charger]);
  useEffect(()=>{ if(fiche) ouvrirModale(dlgFiche); else fermerModale(dlgFiche); },[fiche]);
  useEffect(()=>{ if(edit) ouvrirModale(dlgEdit); else fermerModale(dlgEdit); },[edit]);
  useEffect(()=>{ if(adresse) ouvrirModale(dlgAdr); else fermerModale(dlgAdr); },[adresse]);
  useEffect(()=>{ if(invite) ouvrirModale(dlgInvite); else fermerModale(dlgInvite); },[invite]);

  const chargerDetail = useCallback(async (clientId)=>{
    const [adr, contacts, cmds] = await Promise.all([
      sb.from('adresses_livraison').select('*').eq('client_id', clientId).order('libelle'),
      sb.rpc('lister_acces'),
      sb.from('commandes').select('id, numero, date_livraison, statut, total_ttc')
        .eq('client_id', clientId).order('date_livraison', { ascending:false }).limit(50),
    ]);
    setDetail({
      adresses: adr.data || [],
      contacts: (contacts.data || []).filter(p => p.client_id === clientId),
      commandes: cmds.data || [],
    });
  },[]);

  async function ouvrirFiche(c){ setDetail(null); setFiche(c); chargerDetail(c.id); }

  function nouveau(){
    setEdit({ nom:'', siret:'', email_facturation:'', telephone:'', type_compte:'libre',
              delai_paiement_jours:null, plafond_encours_ht:null, remise_pct:0,
              actif:true, notes_internes:'' });
  }

  async function enregistrer(){
    const { id, ...champs } = edit;
    if (champs.type_compte === 'libre') {
      champs.delai_paiement_jours = null; champs.plafond_encours_ht = null;
    }
    const r = id
      ? await sb.from('clients').update(champs).eq('id', id)
      : await sb.from('clients').insert(champs);
    if (r.error) return toast('Enregistrement refusé : ' + r.error.message);
    setEdit(null); charger(); toast('Client enregistré');
    if (fiche && id === fiche.id) setFiche({ ...fiche, ...champs });
  }

  async function enregistrerAdresse(){
    const { id, ...champs } = adresse;
    const r = id
      ? await sb.from('adresses_livraison').update(champs).eq('id', id)
      : await sb.from('adresses_livraison').insert(champs);
    if (r.error) return toast('Enregistrement refusé : ' + r.error.message);
    setAdresse(null); chargerDetail(fiche.id); toast('Adresse enregistrée');
  }

  // La creation d'un identifiant passe par une fonction serveur : la cle
  // necessaire n'a pas sa place dans une page web.
  async function envoyerAcces(donnees, renvoi){
    setEnvoi(true);
    const { data, error } = await sb.functions.invoke('creer-acces-client', {
      body: { ...donnees, client_id: fiche.id, retour: window.location.origin, renvoi },
    });
    setEnvoi(false);
    if (error || data?.error) {
      return toast('Refusé : ' + (data?.error || error.message));
    }
    setInvite(null); chargerDetail(fiche.id);
    toast(renvoi ? 'Nouveau lien envoyé' : 'Identifiant créé, invitation envoyée');
  }

  async function supprimerAdresse(a){
    if (!confirm(`Supprimer l'adresse « ${a.libelle} » ?`)) return;
    const { error } = await sb.from('adresses_livraison').delete().eq('id', a.id);
    if (error) return toast('Suppression impossible : ' + error.message);
    chargerDetail(fiche.id); toast('Adresse supprimée');
  }

  if (!items) return html`<div class="muted">Chargement…</div>`;

  const filtres = items.filter(c => {
    const q = recherche.trim().toLowerCase();
    if (!q) return true;
    return (c.nom + ' ' + (c.email_facturation||'') + ' ' + (c.siret||'')).toLowerCase().includes(q);
  });

  return html`
    <div>
      <div class="head">
        <div>
          <h2>Clients</h2>
          <div class="muted">Entreprises et particuliers. Les comptes mensuels s'ouvrent ici, à la main.</div>
        </div>
        <button class="btn" onClick=${nouveau}>Nouveau client</button>
      </div>

      <div class="filtres">
        <label><span class="lab">Rechercher</span>
          <input value=${recherche} placeholder="Nom, e-mail ou SIRET"
            onInput=${e=>setRecherche(e.target.value)} /></label>
      </div>

      ${filtres.length === 0
        ? html`<div class="empty">${items.length === 0

/* --------------------------------------------------------------- Commandes */
const LIB_STATUT = {
  brouillon:'Brouillon', attente_paiement:'En attente de paiement', confirmee:'Confirmée',
  en_preparation:'En préparation', livree:'Livrée', annulee:'Annulée',
};
const SUITE = {
  confirmee:'en_preparation', en_preparation:'livree',
};
const LIB_EVENEMENT = {
  creation:'Commande créée', paiement:'Paiement',
  modification:'Modification', notification:'E-mails envoyés',
};

const horodatage = t => t
  ? new Date(t).toLocaleString('fr-FR',
      { day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' })
  : '';

// Résume le contenu de l'événement sans afficher le JSON brut.
function descriptionEvenement(ev) {
  const d = ev.detail || {};
  if (ev.type === 'creation') {
    return d.source === 'portail' ? ' depuis le portail client'
         : d.source === 'backoffice' ? ' depuis le back-office' : '';
  }
  if (ev.type === 'modification') {
    if (d.champ === 'statut') {
      return ' : ' + (LIB_STATUT[d.avant] || d.avant) + ' vers '
           + (LIB_STATUT[d.apres] || d.apres)
           + (d.source ? ' (' + d.source + ')' : '');
    }
    if (d.evenement) return ' : ' + d.evenement;
    return d.source === 'backoffice' ? ' depuis le back-office' : '';
  }
  if (ev.type === 'paiement') {
    return d.montant != null ? ' de ' + euros(d.montant / 100) : '';
  }
  if (ev.type === 'notification') {
    return d.client ? ' au client et à l\'équipe' : ' à l\'équipe';
  }
  return '';
}

function Commandes({ toast }) {
  const [items,setItems] = useState(null);
  const [statut,setStatut] = useState('actives');
  const [depuis,setDepuis] = useState('');
  const [ouverte,setOuverte] = useState(null);
  const [lignes,setLignes] = useState(null);
  const [journal,setJournal] = useState(null);
  const [errLecture,setErrLecture] = useState('');
  const [maj,setMaj] = useState(null);
  const [edit,setEdit] = useState(null);
  const [refs,setRefs] = useState({ clients:[], plateaux:[], creneaux:[] });
  const [adresses,setAdresses] = useState([]);
  const dlg = useRef(null);
  const dlgEdit = useRef(null);

  const charger = useCallback(async ()=>{
    const { data, error } = await sb.from('commandes')
      .select('*, clients(nom, email_facturation), creneaux_livraison(libelle)')
      .order('date_livraison', { ascending:false }).limit(200);
    // Sans ce report, une lecture refusée donnerait le même écran vide
    // qu'une absence réelle de commande.
    if (error) { setErrLecture(error.message); setItems([]); return; }
    setErrLecture(''); setItems(data || []); setMaj(new Date());
  },[]);
  useEffect(()=>{ charger(); },[charger]);
  useEffect(()=>{ if(ouverte) ouvrirModale(dlg); else fermerModale(dlg); },[ouverte]);

  // Les commandes arrivent pendant qu'on regarde l'écran : on recharge
  // au retour sur l'onglet plutôt que d'afficher une liste figée.
  useEffect(()=>{
    const auRetour = ()=>{ if (!document.hidden) charger(); };
    document.addEventListener('visibilitychange', auRetour);
    window.addEventListener('focus', auRetour);
    return ()=>{
      document.removeEventListener('visibilitychange', auRetour);
      window.removeEventListener('focus', auRetour);
    };
  },[charger]);
  useEffect(()=>{ if(edit) ouvrirModale(dlgEdit); else fermerModale(dlgEdit); },[edit]);

  useEffect(()=>{ (async ()=>{
    const [cl, pl, cr] = await Promise.all([
      sb.from('clients').select('id, nom, type_compte, remise_pct').eq('actif', true).order('nom'),
      sb.from('plateaux').select('id, nom, categorie, prix_ht, tva_pct').eq('actif', true).order('nom'),
      sb.from('creneaux_livraison').select('id, libelle').eq('actif', true).order('heure_debut'),
    ]);
    setRefs({ clients: cl.data||[], plateaux: pl.data||[], creneaux: cr.data||[] });
  })(); },[]);

  // Les adresses connues du client selectionne, pour eviter une ressaisie.
  useEffect(()=>{ (async ()=>{
    if (!edit?.client_id) { setAdresses([]); return; }
    const { data } = await sb.from('adresses_livraison')
      .select('*').eq('client_id', edit.client_id).eq('actif', true);
    setAdresses(data || []);
  })(); },[edit?.client_id]);

  function nouvelle(){
    const d = new Date(); d.setDate(d.getDate() + 1);
    setEdit({ client_id:'', date_livraison:d.toISOString().slice(0,10), creneau_id:'',
      adresse_ligne1:'', adresse_ligne2:'', adresse_cp:'', adresse_ville:'', adresse_infos:'',
      adresse_service:'', adresse_code_acces:'', adresse_contact:'',
      adresse_contact_tel:'', adresse_tel_securite:'',
      mode_paiement:'compte', statut:'confirmee', commentaire_client:'', commentaire_interne:'',
      qte:{} });
  }

  async function modifier(c){
    const { data } = await sb.from('commande_lignes').select('*').eq('commande_id', c.id);
    const qte = {};
    (data||[]).forEach(l => { if (l.plateau_id) qte[l.plateau_id] = l.quantite; });
    setEdit({ ...c, qte });
  }

  async function enregistrerCommande(){
    const e = edit;
    const lignesChoisies = Object.entries(e.qte)
      .filter(([,q]) => q > 0)
      .map(([id,q]) => ({ plateau: refs.plateaux.find(p=>p.id===id), quantite:q }))
      .filter(x => x.plateau);
    if (!lignesChoisies.length) return toast('Ajoute au moins un plateau.');

    const champs = {
      client_id: e.client_id,
      date_livraison: e.date_livraison,
      creneau_id: e.creneau_id || null,
      adresse_ligne1: e.adresse_ligne1, adresse_ligne2: e.adresse_ligne2 || null,
      adresse_cp: e.adresse_cp, adresse_ville: e.adresse_ville,
      adresse_infos: e.adresse_infos || null,
      adresse_service: e.adresse_service || null,
      adresse_code_acces: e.adresse_code_acces || null,
      adresse_contact: e.adresse_contact || null,
      adresse_contact_tel: e.adresse_contact_tel || null,
      adresse_tel_securite: e.adresse_tel_securite || null,
      mode_paiement: e.mode_paiement,
      commentaire_client: e.commentaire_client || null,
      commentaire_interne: e.commentaire_interne || null,
    };
    // Une commande carte marquee confirmee doit porter une date de reglement.
    if (e.statut === 'confirmee' && e.mode_paiement === 'cb' && !e.paye_le) {
      champs.paye_le = new Date().toISOString();
    }

    let id = e.id;
    if (id) {
      const { error } = await sb.from('commandes')
        .update({ ...champs, statut:'brouillon' }).eq('id', id);
      if (error) return toast('Enregistrement refusé : ' + error.message);
    } else {
      const cl = refs.clients.find(c=>c.id === e.client_id);
      const { data, error } = await sb.from('commandes').insert({
        ...champs, statut:'brouillon', source:'backoffice',
        remise_pct: cl?.remise_pct ?? 0,
      }).select('id').single();
      if (error) return toast('Création refusée : ' + error.message);
      id = data.id;
    }

    await sb.from('commande_lignes').delete().eq('commande_id', id);
    const { error: eL } = await sb.from('commande_lignes').insert(
      lignesChoisies.map(x => ({
        commande_id: id, plateau_id: x.plateau.id, libelle: x.plateau.nom,
        categorie: x.plateau.categorie, quantite: x.quantite,
        prix_unitaire_ht: x.plateau.prix_ht, tva_pct: x.plateau.tva_pct,
      })));
    if (eL) return toast('Lignes refusées : ' + eL.message);

    // Le statut definitif est pose apres les lignes, pour que les totaux se calculent.
    const { error: eS } = await sb.from('commandes').update({ statut: e.statut }).eq('id', id);
    if (eS) return toast('Statut refusé : ' + eS.message);

    await sb.from('commande_evenements').insert({
      commande_id: id, type: e.id ? 'modification' : 'creation',
      detail: { source: 'backoffice' } });

    setEdit(null); charger(); toast(e.id ? 'Commande modifiée' : 'Commande créée');
  }

  async function supprimer(c){
    if (!confirm(`Supprimer définitivement la commande ${c.numero} ?\n\n`
      + `Elle disparaîtra de l'historique du client et des statistiques. `
      + `Pour garder une trace, annule-la plutôt.`)) return;
    const { error } = await sb.from('commandes').delete().eq('id', c.id);
    if (error) return toast('Suppression refusée : ' + error.message);
    setOuverte(null); charger(); toast('Commande supprimée');
  }

  async function ouvrir(c){
    setLignes(null); setJournal(null); setOuverte(c);
    const [lg, ev] = await Promise.all([
      sb.from('commande_lignes').select('*').eq('commande_id', c.id),
      sb.from('commande_evenements').select('*')
        .eq('commande_id', c.id).order('created_at', { ascending:false }),
    ]);
    setLignes(lg.data || []); setJournal(ev.data || []);
  }

  async function changerStatut(c, nouveau){
    const { error } = await sb.from('commandes').update({ statut:nouveau }).eq('id', c.id);
    if (error) return toast('Changement refusé : ' + error.message);
    await sb.from('commande_evenements').insert({
      commande_id:c.id, type:'modification',
      detail:{ champ:'statut', avant:c.statut, apres:nouveau } });
    charger(); setOuverte({ ...c, statut:nouveau }); toast('Statut mis à jour');
  }

  if (!items) return html`<div class="muted">Chargement…</div>`;

  const visibles = items.filter(c => {
    if (statut === 'actives' && ['livree','annulee'].includes(c.statut)) return false;
    if (statut !== 'actives' && statut !== 'toutes' && c.statut !== statut) return false;
    if (depuis && c.date_livraison < depuis) return false;
    return true;
  });

  return html`

/* --------------------------------------------------------------- Journaux */
const LIB_CATEGORIE = {
  commandes:'Commandes', clients:'Clients et adresses',
  catalogue:'Catalogue', parametres:'Paramètres',
};
const LIB_ACTION = {
  creation:'Création', modification:'Modification', suppression:'Suppression',
  paiement:'Paiement', notification:'Notification',
};
// Les champs techniques ne disent rien d'utile en clair.
const CHAMPS_MASQUES = ['id','stripe_checkout_id','stripe_payment_intent_id','cgv_version'];
const LIB_CHAMP = {
  nom:'nom', prix_ht:'prix HT', actif:'actif', statut:'statut', publie:'publié',
  quantite:'quantité', remise_pct:'remise', type_compte:'type de compte',
  minimum_plateaux:'minimum de plateaux', heure_limite:'heure limite',
  zone_livraison_cp:'zone de livraison', date_livraison:'date de livraison',
  delai_paiement_jours:'délai de paiement', email_facturation:'e-mail de facturation',
  total_ttc:'total TTC', telephone:'téléphone', siret:'SIRET',
};

function valeurLisible(v){
  if (v === null || v === undefined || v === '') return '—';
  if (typeof v === 'boolean') return v ? 'oui' : 'non';
  if (Array.isArray(v)) return v.join(', ');
  if (typeof v === 'object') return JSON.stringify(v);
  return LIB_STATUT[v] || String(v);
}

function Journaux(){
  const [items,setItems] = useState(null);
  const [categorie,setCategorie] = useState('toutes');
  const [depuis,setDepuis] = useState('');
  const [recherche,setRecherche] = useState('');

  const charger = useCallback(async ()=>{
    let q = sb.from('v_journal').select('*')
      .order('created_at', { ascending:false }).limit(400);
    if (categorie !== 'toutes') q = q.eq('categorie', categorie);
    if (depuis) q = q.gte('created_at', depuis);
    const { data } = await q;
    setItems(data || []);
  },[categorie, depuis]);
  useEffect(()=>{ charger(); },[charger]);

  if (!items) return html`<div class="muted">Chargement…</div>`;

  const visibles = items.filter(e => {
    const r = recherche.trim().toLowerCase();
    if (!r) return true;
    return ((e.cible || '') + ' ' + (e.categorie || '')).toLowerCase().includes(r);
  });

  // Regroupement par jour, pour que la lecture reste possible sur 400 lignes.
  const jours = [];
  visibles.forEach(e => {
    const j = new Date(e.created_at).toLocaleDateString('fr-FR',
      { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    const dernier = jours[jours.length - 1];
    if (dernier && dernier.jour === j) dernier.lignes.push(e);
    else jours.push({ jour:j, lignes:[e] });
  });

  return html`
    <div>
      <div class="head">
        <div>
          <h2>Journaux</h2>
          <div class="muted">Toutes les écritures, côté client comme côté back-office.</div>
        </div>
      </div>

      <div class="filtres">
        <label><span class="lab">Catégorie</span>
          <select value=${categorie} onChange=${e=>setCategorie(e.target.value)}>
            <option value="toutes">Toutes</option>
            ${Object.keys(LIB_CATEGORIE).map(k=>html`
              <option key=${k} value=${k}>${LIB_CATEGORIE[k]}</option>`)}
          </select></label>
        <label><span class="lab">Depuis le</span>
          <input type="date" value=${depuis} onInput=${e=>setDepuis(e.target.value)} /></label>
        <label><span class="lab">Rechercher</span>
          <input value=${recherche} placeholder="Numéro, nom…"
            onInput=${e=>setRecherche(e.target.value)} /></label>
      </div>

      ${visibles.length === 0
        ? html`<div class="empty">Aucune écriture ne correspond à ces filtres.</div>`
        : jours.map(g => html`
          <div key=${g.jour} style="margin-bottom:22px">
            <div class="eyebrow" style="margin-bottom:8px">${g.jour} — ${g.lignes.length}</div>
            ${g.lignes.map((e,i) => html`
              <div class="card" key=${e.created_at + '-' + i} style="padding:12px 16px">
                <div class="row" style="align-items:flex-start">
                  <div style="flex:1;min-width:220px">
                    <div>
                      <span class="tag">${LIB_CATEGORIE[e.categorie] || e.categorie}</span>
                      <span style="margin-left:8px">${LIB_ACTION[e.action] || e.action}</span>
                      <strong style="margin-left:6px">${e.cible}</strong>
                    </div>
                    ${e.detail && html`<div class="journal" style="margin-top:6px">
                      ${Object.keys(e.detail)
                        .filter(k => !CHAMPS_MASQUES.includes(k))
                        .slice(0, 8)
                        .map(k => html`<div class="quand" key=${k}>
                          ${e.detail[k] && e.detail[k].avant !== undefined
                            ? (LIB_CHAMP[k] || k) + ' : ' + valeurLisible(e.detail[k].avant)
                              + ' → ' + valeurLisible(e.detail[k].apres)
                            : (LIB_CHAMP[k] || k) + ' : ' + valeurLisible(e.detail[k])}
                        </div>`)}
                    </div>`}
                    ${e.detail?.a_verifier && html`
                      <div class="alerte">
                        <strong>À vérifier.</strong> ${e.detail.a_verifier}.
                      </div>`}
                  </div>
                  <div class="quand" style="flex-shrink:0">
                    ${new Date(e.created_at).toLocaleTimeString('fr-FR',
                      { hour:'2-digit', minute:'2-digit' })}
                  </div>
                </div>
              </div>`)}
          </div>`)}

      ${items.length >= 400 && html`<div class="muted" style="text-align:center">
        Seules les 400 écritures les plus récentes sont affichées. Affine les filtres.</div>`}
    </div>`;
}


/* ------------------------------------------------------------------ Accès */
const LIB_ROLE = { admin:'Administrateur', equipe:'Équipe', client:'Client' };

function Acces({ moi, toast }){
  const [items,setItems] = useState(null);
  const [recherche,setRecherche] = useState('');
  const [enCours,setEnCours] = useState(null);

  const charger = useCallback(async ()=>{
    const { data, error } = await sb.rpc('lister_acces');
    if (error) { toast('Lecture refusée : ' + error.message); setItems([]); return; }
    setItems(data || []);
  },[toast]);
  useEffect(()=>{ charger(); },[charger]);

  async function basculer(p, accorder){
    const nom = [p.prenom, p.nom].filter(Boolean).join(' ') || p.email;
    if (!confirm(accorder
      ? `Donner à ${nom} l'accès au back-office ?\n\n`
        + `Il pourra voir et modifier les commandes, les clients et le catalogue.`
      : `Retirer à ${nom} l'accès au back-office ?\n\n`
        + `Il redeviendra un client ordinaire.`)) return;
    setEnCours(p.id);
    const { error } = await sb.rpc('definir_acces_backoffice',
      { p_profil: p.id, p_acces: accorder });
    setEnCours(null);
    if (error) return toast('Refusé : ' + error.message);
    charger();
    toast(accorder ? 'Accès accordé' : 'Accès retiré');
  }

  if (!items) return html`<div class="muted">Chargement…</div>`;

  const visibles = items.filter(p => {
    const q = recherche.trim().toLowerCase();
    if (!q) return true;
    return [p.prenom, p.nom, p.email, p.client].join(' ').toLowerCase().includes(q);
  });
  const equipe = visibles.filter(p => p.role === 'admin' || p.role === 'equipe');
  const clients = visibles.filter(p => p.role === 'client');

  const carte = p => html`
    <div class="card" key=${p.id}>
      <div class="row">
        <div style="flex:1;min-width:220px">
          <div style="font-weight:500">
            ${[p.prenom, p.nom].filter(Boolean).join(' ') || 'Sans nom'}</div>
          <div class="muted">${p.email}${p.telephone ? ' · ' + p.telephone : ''}</div>
          ${p.client && html`<div class="muted">${p.client}</div>`}
          <div class="tags" style="margin-top:6px">
            <span key="r" class=${'tag' + (p.role !== 'client' ? ' on' : '')}>
              ${LIB_ROLE[p.role] || p.role}</span>
            ${p.derniere_connexion && html`<span key="c" class="tag">
              Vu le ${horodatage(p.derniere_connexion)}</span>`}
          </div>
        </div>
        <div class="actions">
          ${p.role === 'admin'
            ? html`<span class="muted">Compte propriétaire</span>`
            : !moi.estAdmin
              ? html`<span class="muted">Modifiable par l'administrateur</span>`
              : p.role === 'equipe'
                ? html`<button class="btn danger" disabled=${enCours === p.id}
                    onClick=${()=>basculer(p, false)}>Retirer l'accès</button>`
                : html`<button class="btn ghost" disabled=${enCours === p.id}
                    onClick=${()=>basculer(p, true)}>Donner l'accès</button>`}
        </div>
      </div>
    </div>`;

  return html`
    <div>
      <div class="head">
        <div>
          <h2>Accès</h2>
          <div class="muted">Qui peut entrer dans ce back-office.</div>
        </div>
      </div>

      ${!moi.estAdmin && html`<div class="muted" style="margin-bottom:16px">
        Seul le compte administrateur peut accorder ou retirer un accès.</div>`}

      <div class="filtres">
        <label><span class="lab">Rechercher</span>
          <input value=${recherche} placeholder="Nom, e-mail, organisation"
            onInput=${e=>setRecherche(e.target.value)} /></label>
      </div>

      <div class="eyebrow" style="margin-bottom:8px">
        Accès back-office — ${equipe.length}</div>
      ${equipe.length === 0
        ? html`<div class="empty">Aucun compte n'a accès au back-office.</div>`
        : equipe.map(carte)}

      <div class="eyebrow" style="margin:26px 0 8px">Comptes clients — ${clients.length}</div>
      ${clients.length === 0
        ? html`<div class="empty">Aucun compte client.</div>`
        : clients.map(carte)}
    </div>`;
}

/* -------------------------------------------------------------------- App */
const ONGLETS = [
  { k:'commandes',   label:'Commandes',   C:Commandes },
  { k:'clients',     label:'Clients',     C:Clients },
  { k:'composants',  label:'Composants',  C:Composants },
  { k:'plateaux',    label:'Plateaux',    C:Plateaux },
  { k:'menus',       label:'Menus',       C:Menus },
  { k:'parametres',  label:'Paramètres',  C:Parametres },
  { k:'journaux',    label:'Journaux',    C:Journaux },
  { k:'acces',       label:'Accès',       C:Acces },
];

function App(){
  const [session,setSession] = useState(undefined);
  const [profil,setProfil] = useState(null);
  const [erreurProfil,setErreurProfil] = useState(null);
  const [onglet,setOnglet] = useState('commandes');
  const [allergenes,setAllergenes] = useState([]);
  const [msg,setMsg] = useState('');

  const toast = t => { setMsg(t); setTimeout(()=>setMsg(''), 3200); };

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const { data:sub } = sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=>sub.subscription.unsubscribe();
  },[]);

  useEffect(()=>{
    if (!session) { setProfil(null); return; }
    (async ()=>{
      const [rp, ra] = await Promise.all([
        sb.from('profils').select('*').eq('id', session.user.id).maybeSingle(),
        sb.from('allergenes').select('*').order('id'),
      ]);
      if (rp.error) {
        console.error('Lecture du profil refusée :', rp.error);
        setErreurProfil(rp.error);
      }
      setProfil(rp.data || { role:'client' });
      setAllergenes(ra.data || []);
    })();
  },[session]);

  if (session === undefined) return html`<div class="shell" style="padding-top:40px">Chargement…</div>`;
  if (!session) return html`<${Login} />`;
  if (!profil) return html`<div class="shell" style="padding-top:40px">Chargement…</div>`;

  const accesBackoffice = profil.role === 'admin' || profil.role === 'equipe';
  if (!accesBackoffice) return html`
    <div class="shell" style="padding-top:40px">
      <h2>Accès réservé</h2>
      ${erreurProfil
        ? html`<div class="err" style="margin:14px 0;white-space:pre-wrap">
             <strong>La lecture du profil a échoué.</strong><br/>
             message : ${erreurProfil.message || '—'}<br/>
             code : ${erreurProfil.code || '—'}<br/>
             détail : ${erreurProfil.details || '—'}<br/>
             indice : ${erreurProfil.hint || '—'}
           </div>`
        : html`<p class="muted">Ce compte n'a pas les droits d'administration.</p>`}
      <button class="btn ghost" onClick=${()=>sb.auth.signOut()}>Se déconnecter</button>
    </div>`;

  const Actif = (ONGLETS.find(o=>o.k===onglet)||ONGLETS[0]).C;

  return html`
    <div class="shell">
      <header class="top">
        <div style="display:flex;align-items:center;gap:12px">
          <img class="logo" src="/logo-briffe.png" alt="BRIFFE" width="196" height="96" />
          <span class="eyebrow">Back-office commandes</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="muted">${session.user.email}</span>
          <button class="btn ghost" onClick=${()=>sb.auth.signOut()}>Se déconnecter</button>
        </div>
      </header>
      <nav class="tabs">
        ${ONGLETS.map(o=>html`
          <button key=${o.k} aria-current=${onglet===o.k}
            onClick=${()=>setOnglet(o.k)}>${o.label}</button>`)}
      </nav>
      <${Actif} allergenes=${allergenes} toast=${toast}
        moi=${{ id: session.user.id, estAdmin: profil.role === 'admin' }} />
      ${msg && html`<div class="toast" role="status">${msg}</div>`}
    </div>`;
}

window.__briffeOK = true;
document.getElementById('root').textContent = '';
createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
